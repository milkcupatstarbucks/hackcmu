<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/whiteboard.css">
    <link rel="stylesheet" href="/organizer.css">
    <title>Phaser - Template</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>
    <div id="whiteboard-panel" hidden>
  <div class="whiteboard-card">
    <div class="whiteboard-toolbar">
      <strong>The Fence</strong>

      <button id="whiteboard-pen" aria-pressed="true">
        Pen
      </button>

      <button id="whiteboard-text" aria-pressed="false">
        Text
      </button>

      <label>
        Color
        <input
          id="whiteboard-color"
          type="color"
          value="#c41230"
        >
      </label>

      <label>
        Width
        <input
          id="whiteboard-width"
          type="range"
          min="1"
          max="16"
          value="4"
        >
      </label>

      <button id="whiteboard-undo">Undo mine</button>
      <button id="whiteboard-close">Close</button>
      <button id="whiteboard-organize">Scotty, organize this</button>
    </div>

    <p id="whiteboard-status" role="status"></p>

    <canvas
      id="whiteboard-canvas"
      width="1024"
      height="768"
      aria-label="Shared drawing board"
    ></canvas>
    <section id="organizer-panel" aria-label="Board topics">
    <p id="organizer-status" role="status">
        Add some text notes, then ask Scotty to organize them.
    </p>

    <div id="organizer-topics"></div>
    <div id="organizer-details"></div>
    </section>
    <p id="whiteboard-presence"></p>
  </div>
</div>
<script src="/whiteboard.js"></script>
<script src="/organizer.js"></script>

<script src="/whiteboard-network.js"></script>
<script src="/organizer-api.js"></script>
<script src="/board-test.js"></script>
</body>
</html>
